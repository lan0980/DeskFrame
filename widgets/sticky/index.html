<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>便签</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  body {
    display: flex; align-items: stretch; justify-content: stretch;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  /* 视觉基准卡片。无边框窗口只有在声明了拖动区域的像素上才能移动，所以整张卡片是 drag，
     下面的输入框和按钮再单独挖成 no-drag。 */
  .card {
    flex: 1; display: flex; flex-direction: column;
    padding: 16px 22px; border-radius: 16px; color: #fff;
    background: rgba(24, 28, 40, .55); backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
    -webkit-app-region: drag;
  }
  button, input, textarea, select, a { -webkit-app-region: no-drag; }

  .head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; font-size: 11px; opacity: .7; user-select: none;
  }
  .head .tag { font-weight: 600; letter-spacing: 2px; }

  #note {
    flex: 1; width: 100%; min-height: 0; margin: 8px 0; padding: 0;
    border: none; outline: none; resize: none; overflow-y: auto;
    background: transparent; color: inherit; font-family: inherit;
    font-size: 14px; line-height: 1.55; caret-color: currentColor;
  }
  #note::placeholder { color: currentColor; opacity: .45; }
  #note::-webkit-scrollbar { width: 6px; }
  #note::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, .5); border-radius: 3px; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
  #status {
    font-size: 11px; opacity: .5; transition: opacity .45s ease; user-select: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.flash { opacity: .95; }
  #status.dim { opacity: 0; }

  #clearBtn {
    flex: none; border: none; border-radius: 10px; padding: 4px 12px;
    font-family: inherit; font-size: 12px; line-height: 1.4; cursor: pointer;
    color: inherit; background: rgba(128, 128, 128, .22);
  }
  #clearBtn:hover { background: rgba(128, 128, 128, .38); }
  #clearBtn:active { transform: translateY(1px); }

  #error { display: none; }
  .card.failed #error {
    display: flex; flex: 1; align-items: center; justify-content: center;
    text-align: center; font-size: 13px; line-height: 1.6; opacity: .85;
  }
  .card.failed .head, .card.failed #note, .card.failed .foot { display: none; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <span class="tag">便签</span>
      <span>拖动我</span>
    </div>

    <textarea id="note" spellcheck="false" placeholder="写点什么，输入即自动保存…"></textarea>

    <div class="foot">
      <span id="status">已保存</span>
      <button id="clearBtn" type="button" title="清空便签内容">清空</button>
    </div>

    <div id="error">便签初始化失败<br>请在 DeskFrame 管理界面重新加载</div>
  </div>

<script>
  // window.deskframe 是唯一的宿主接口：沙箱内没有 Node、没有 require、没有 fs。
  const host = window.deskframe;

  const STORAGE_KEY = 'sticky.text';
  const SAVE_DEBOUNCE = 500;

  const card = document.getElementById('card');
  const note = document.getElementById('note');
  const status = document.getElementById('status');
  const clearBtn = document.getElementById('clearBtn');

  const DEFAULTS = { paper: '#ffd966', fontScale: 14, opacity: '0.9' };
  let cfg = Object.assign({}, DEFAULTS);

  let saveTimer = null;
  let dimTimer = null;
  let dirty = false;

  /* ---------- 本地持久化：宿主给每个小部件分配了独立持久分区，localStorage 重启后保留 ---------- */

  function readStored() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return typeof raw === 'string' ? raw : '';
    } catch (err) {
      return '';
    }
  }

  function writeStored(text) {
    try {
      localStorage.setItem(STORAGE_KEY, text);
      return true;
    } catch (err) {
      showStatus('本地存储不可用，未能保存');
      return false;
    }
  }

  function clearStored() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (err) { /* 忽略：内容已在界面上清空 */ }
  }

  /* ---------- 状态提示：保存后写「已保存 · HH:MM:SS」，短暂高亮再淡出 ---------- */

  function pad2(n) { return String(n).padStart(2, '0'); }

  function showStatus(text) {
    clearTimeout(dimTimer);
    status.classList.remove('dim');
    status.classList.remove('flash');
    status.textContent = text;
  }

  function stampSaved() {
    const d = new Date();
    showStatus('已保存 · ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()));
    status.classList.add('flash');
    // 停留一会儿再淡出，回到「已保存」的静息文案。
    dimTimer = setTimeout(() => {
      status.classList.remove('flash');
      status.classList.add('dim');
      dimTimer = setTimeout(() => {
        status.classList.remove('dim');
        status.textContent = '已保存';
      }, 500);
    }, 1600);
  }

  /* ---------- 外观：底色 / 字号 / 不透明度只作用于卡片背景 alpha，文字保持清晰 ---------- */

  function hexToRgb(input) {
    let v = String(input == null ? '' : input).trim().replace(/^#/, '');
    if (/^[0-9a-fA-F]{3}$/.test(v)) v = v.split('').map((c) => c + c).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(v)) return null;
    const n = parseInt(v, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function alphaOf(value) {
    // configSchema 里 opacity 是 enum 字符串（"0.7"/"0.85"/"1"），数字也一并容错。
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return 0.9;
    return Math.min(1, Math.max(0.35, n));
  }

  function fontPx(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return DEFAULTS.fontScale;
    return Math.min(40, Math.max(10, Math.round(n)));
  }

  function applyConfig() {
    const rgb = hexToRgb(cfg.paper) || hexToRgb(DEFAULTS.paper);
    const alpha = alphaOf(cfg.opacity);
    card.style.background = 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', ' + alpha + ')';

    // 亮底色（默认黄）用深色字，深底色仍用白字，保证可读性。
    const luminance = (0.2126 * rgb.r + 0.7152 * rgb.g + 0.0722 * rgb.b) / 255;
    card.style.color = luminance > 0.6 ? 'rgba(46, 36, 4, .95)' : '#fff';

    note.style.fontSize = fontPx(cfg.fontScale) + 'px';
  }

  /* ---------- 自动保存（防抖约 500ms） ---------- */

  function flushSave() {
    if (!dirty) return;
    dirty = false;
    if (writeStored(note.value)) stampSaved();
  }

  function scheduleSave() {
    dirty = true;
    clearTimeout(saveTimer);
    showStatus('输入中…');
    saveTimer = setTimeout(flushSave, SAVE_DEBOUNCE);
  }

  note.addEventListener('input', scheduleSave);
  // 失焦、切走、窗口被隐藏前，把还没落盘的输入立即写一次。
  note.addEventListener('blur', () => { clearTimeout(saveTimer); flushSave(); });
  window.addEventListener('pagehide', () => { clearTimeout(saveTimer); flushSave(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { clearTimeout(saveTimer); flushSave(); }
  });

  clearBtn.addEventListener('click', () => {
    clearTimeout(saveTimer);
    dirty = false;
    note.value = '';
    clearStored();
    showStatus('已清空');
    note.focus();
  });

  /* ---------- 生命周期 ---------- */

  function init() {
    note.value = readStored();
    applyConfig();
    showStatus('已保存');
  }

  // 必须调用 ready()，否则宿主会判定小部件失败并隔离。
  if (!host || typeof host.ready !== 'function') {
    card.classList.add('failed');
  } else {
    host.ready()
      .then(() => host.getConfig())
      .then((c) => {
        cfg = Object.assign(cfg, c || {});
        init();
      })
      .catch(() => { card.classList.add('failed'); });

    host.on('config', (next) => {
      cfg = Object.assign(cfg, next || {});
      applyConfig();
    });

    host.on('show', () => {
      // 重新显示时同步一次磁盘上的内容（例如上一次会话遗留的输入），但不动正在编辑的框。
      clearTimeout(saveTimer);
      flushSave();
      if (document.activeElement !== note) note.value = readStored();
      dirty = false;
      showStatus('已保存');
    });
  }
</script>
</body>
</html>
