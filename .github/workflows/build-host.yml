name: Build host (portable)

# Publishing is driven by the version number: pushing a package.json whose version has
# no tag yet cuts that tag and publishes it. Pushes that keep the version unchanged only
# build and validate. Pushing a v* tag directly also publishes.
on:
  push:
    branches: [main]
    paths:
      - 'host/**'
      - 'widgets/**'
      - 'package.json'
      - 'CHANGELOG.md'
      - '.github/workflows/build-host.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # npm install, not npm ci: this repo does not track a lockfile (see .gitignore).
        run: npm install

      - name: Validate widget manifests
        run: node scripts/validate-widgets.js

      - name: Build portable exe
        run: npx electron-builder --win

      # These two refs came from the old rolling-preview setup. Deleting a release does
      # not delete the tag it created, and a tag literally named "latest" reads like a
      # second version to anyone browsing the repo, so sweep both every build.
      - name: Retire leftover tags and releases
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for stale in latest widgets-latest; do
            id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${stale}" --jq .id 2>/dev/null || true)"
            if [ -n "${id}" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" \
                && echo "deleted release: ${stale}"
            fi
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${stale}" >/dev/null 2>&1; then
              echo "deleted tag: ${stale}"
            fi
          done

      - name: Decide whether this build is a new version
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "published by tag push: ${GITHUB_REF_NAME}"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v${version}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "${tag} already exists; building without publishing"
            else
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "${tag} not published yet; this build will cut it"
            fi
          fi

      # Nothing to publish, but still fail loudly if package.json and CHANGELOG disagree.
      - name: Preview release notes when not publishing
        if: steps.rel.outputs.publish == 'false'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.js "$version" -o preview-notes.md
          echo "CHANGELOG covers version ${version}; no new release needed."

      - name: Cut the version tag
        if: steps.rel.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already present"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" --jq .ref
            echo "created ${TAG} at ${GITHUB_SHA}"
          fi

      - name: Prepare release assets
        if: steps.rel.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum DeskFrame-win-x64.exe > DeskFrame-win-x64.exe.sha256 && cat DeskFrame-win-x64.exe.sha256)

      - name: Write release notes from CHANGELOG
        if: steps.rel.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: node scripts/release-notes.js "${TAG}" -o release-notes.md

      - name: Publish versioned release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: DeskFrame ${{ steps.rel.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/DeskFrame-win-x64.exe
            dist/DeskFrame-win-x64.exe.sha256
          prerelease: false
          draft: false
          make_latest: true
