name: Build host (portable)

on:
  push:
    branches: [main]
    paths:
      - 'host/**'
      - 'package.json'
      - '.github/workflows/build-host.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-host
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stale nested folder
        continue-on-error: true
        shell: bash
        run: |
          if [ -d "deskframe" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -r deskframe
            git commit -m "chore: remove stale nested upload folder"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          node-version: '20'

      - name: Install dependencies
        # npm install, not npm ci: this repo does not track a lockfile (see .gitignore).
        run: npm install



      - name: Build portable exe
        run: npx electron-builder --win

      - name: Remove obsolete zip asset
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/latest" \
            --jq '.assets[] | select(.name == "DeskFrame-win-x64.zip") | .id' 2>/dev/null \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
            done

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DeskFrame (Latest Build)
          body: |
            Automated portable build from commit ${{ github.sha }}

            **Download** `DeskFrame-win-x64.exe` and double-click to run. No install, no extraction needed.

            > Rolling release — always reflects the latest build of the `main` branch.
          files: dist/DeskFrame-win-x64.exe
          prerelease: true
          make_latest: false