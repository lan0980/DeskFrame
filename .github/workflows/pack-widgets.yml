name: Validate and pack widgets

# Bundled widgets now ship inside the host executable, so this workflow no longer
# publishes a separate release. It still gates bad manifests, and keeps per-widget
# .widget.zip files as build artifacts for sharing one widget on its own.
on:
  push:
    branches: [main]
    paths:
      - 'widgets/**'
      - 'scripts/validate-widgets.js'
      - '.github/workflows/pack-widgets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-widgets
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate widget manifests
        run: node scripts/validate-widgets.js

      - name: Pack widgets
        shell: bash
        run: |
          mkdir -p artifacts
          for dir in widgets/*/; do
            name=$(basename "$dir")
            [ "$name" = "_template" ] && continue
            [ -f "$dir/widget.json" ] || continue
            (cd "$dir" && zip -r "../../artifacts/${name}.widget.zip" . -x "*.DS_Store")
          done
          ls -l artifacts || true

      - name: Upload widget packs
        uses: actions/upload-artifact@v4
        with:
          name: widget-packs
          path: artifacts/*.widget.zip
          if-no-files-found: error
